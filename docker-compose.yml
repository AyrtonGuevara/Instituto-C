version: '2.21.0'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Creatica_instituto
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: Creatica_instituto_db
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: dbadmin
      POSTGRES_db: creatica_db
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
